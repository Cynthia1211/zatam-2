    const status = new Label({
        text:"Wrong Checks: ०",
        size:25,
        color:red,
        bold:true,
        outlineColor:black
    }).pos(0,125,CENTER,TOP);

    const timer = new Timer({
        time:0,
        down:false,
        colon:true,
        startPaused:true,
        size:25,
        color:black,
        backgroundColor:yellow,
        borderColor:black,
        borderWidth:2,
        width:135,
        height:45
    }).pos(65,140,RIGHT,TOP);

    const board = new Container(boardW, boardH).pos(boardX,200,CENTER,TOP);
    const cardLayer = new Container(boardW, boardH).addTo(board);

    // Backing board
    new Rectangle(boardW+18, boardH+18, white, black, 2, 14)
        .centerReg(board)
        .alp(.75)
        .bot();

    const buttonBar = new Container(760,52).pos(0,25,CENTER,BOTTOM);

    const newGameBtn = new Button({
        label:new Label({
            text:"NEW GAME",
            size:18
        }), 
        width:150, 
        height:45, 
        backgroundColor:purple, 
        rollBackgroundColor:purple.lighten(.2), 
        color:white
    })
    .loc(0,0,buttonBar)
    .tap(()=>startGame());

    const filterNames = [
        "All",
        "Noun - Masculine",
        "Noun - Feminine",
        "Noun - Neuter",
        "Pronoun - Masculine",
        "Pronoun - Feminine",
        "Pronoun - Neuter",
        "Pronoun - Common"
    ];

    const filterPane = new Pane({
        width:360,
        height:430,
        title:"Choose Filter",
        backgroundColor:white,
        color:black,
        corner:14
    });

    filterNames.forEach((name, i) => {
        new Button({
            label:new Label({
                text:name,
                size:18,
                color:white
            }),
            width:280,
            height:38,
            backgroundColor:i === filterIndex ? green : purple,
            rollBackgroundColor:green,
            color:white,
            corner:10
        })
        .center(filterPane)
        .mov(0, -140 + i*42)
        .tap(() => {
            filterIndex = i;
            nounIndex = -1;
            filterPane.hide();
            startGame();
            S.update();
        });
    });

    const filterBtn = new Button({
        label:new Label({
            text:"FILTER",
            size:18
        }),
        width:130,
        height:45,
        backgroundColor:green,
        rollBackgroundColor:green.lighten(.2),
        color:white
    })
    .loc(165,0,buttonBar)
    .tap(() => {
        filterPane.show();
    });

    const checkBtn = new Button({
        label:new Label({
            text:"CHECK ALL",
            size:18
        }), 
        width:150, 
        height:45, 
        backgroundColor:orange, 
        rollBackgroundColor:orange.lighten(.2), 
        color:white
    })
    .loc(310,0,buttonBar)
    .tap(()=>checkMatrix(0));

    const solveBtn = new Button({
        label:new Label({
            text:"SOLVE",
            size:18
        }), 
        width:120, 
        height:45, 
        backgroundColor:red, 
        rollBackgroundColor:red.lighten(.2), 
        color:white
    })
    .loc(475,0,buttonBar)
    .tap(()=>solveBoard());

    const nextBtn = new Button({
        label:new Label({
            text:"NEXT",
            size:18
        }), 
        width:120, 
        height:45, 
        backgroundColor:black, 
        rollBackgroundColor:dark, 
        color:white
    })
    .loc(610,0,buttonBar)
    .tap(()=>startGame());

    drawEmptyBoard();
    S.update();

    function toDevanagari(num) {
        return String(num).replace(/[0-9]/g, d => "०१२३४५६७८९"[Number(d)]);
    }

    function shuffle(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    function isPronoun(n) {
        return String(n.ending).trim().length === 0;
    }

    function nextNoun() {
        const filter = FILTERS[filterIndex];
        for (let tries=0; tries<NOUNS.length; tries++) {
            nounIndex = (nounIndex + 1) % NOUNS.length;
            const n = NOUNS[nounIndex];
            if (filter.gender && n.gender !== filter.gender) continue;
            if (filter.pronoun !== null && isPronoun(n) !== filter.pronoun) continue;
            return n;
        }
        return NOUNS[0];
    }

    function drawEmptyBoard() {
        board.removeAllChildren();
        new Rectangle(boardW+18, boardH+18, white, black, 2, 14)
            .centerReg(board)
            .alp(.75)
            .bot();
        cardLayer.addTo(board);
        cardLayer.removeAllChildren();

        slots = [];
        let x = 0;
        drawCell(x, 0, colW[0], headerH, "Check", true); x += colW[0]+gap;
        drawCell(x, 0, colW[1], headerH, "Role", true); x += colW[1]+gap;
        NUMBERS.forEach((num, i)=>{
            drawCell(x, 0, colW[i+2], headerH, num, true);
            x += colW[i+2]+gap;
        });

        for (let r=0; r<8; r++) {
            const y = headerH + r*rowH;
            let cx = 0;
            const rowButton = new Button({
                label:new Label({
                    text:CASES[r],
                    size:22,
                    color:black,
                    align:LEFT,
                    valign:CENTER
                }),
                width:colW[0],
                height:rowH-4,
                backgroundColor:grey.lighten(.25),
                rollBackgroundColor:grey.lighten(.45),
                color:black,
                corner:6
            }).loc(cx, y+2, board).tap(()=>checkMatrix(r+1));
            cx += colW[0]+gap;
            drawCell(cx, y, colW[1], rowH, ROLES[r], false); cx += colW[1]+gap;
            for (let c=0; c<3; c++) {
                drawSlot(cx, y, colW[c+2], rowH, r*3+c);
                cx += colW[c+2]+gap;
            }
        }

        cardLayer.top();
    }

    function drawCell(x, y, w, h, text, header=false) {
        const cell = new Container(w,h).loc(x,y,board);
        new Rectangle(w,h, header ? purple.lighten(.45) : grey.lighten(.35), black, 1, 5).addTo(cell);
        new Label({
            text:text,
            size: header ? 17 : 16,
            color:black,
            bold:header,
            align:CENTER,
            valign:CENTER
        }).centerReg(cell);
        return cell;
    }

    function drawSlot(x, y, w, h, index) {
        const slot = new Container(w,h).loc(x,y,board);
        const back = new Rectangle(w,h, "#eeeeee", "#cccccc", 1, 5).addTo(slot);
        slot.back = back;
        slot.slotIndex = index;
        slot.cx = x + w/2;
        slot.cy = y + h/2;
        slot.locked = false;
        slots[index] = slot;
    }

    function startGame() {
        noun = nextNoun();
        isPlaying = true;
        gameOver = false;
        scoreUploaded = false;
        usedSolve = false;
        wrongMoves = 0;
        solvedCount = 0;
        solvedRows = Array(8).fill(false);
        requiredRows = noun.vocative === false ? 7 : 8;

        drawEmptyBoard();
        nounLabel.text = `Declensions for ${noun.word} (${noun.meaning})`;
        descLabel.text = String(noun.ending).trim().length ? `Gender: ${noun.gender}; Ending in: ${noun.ending}` : `Gender: ${noun.gender}; Pronoun`;
        message.text = "Drag cards to reorder the table.";
        status.text = "Wrong Checks: ०";
        timer.stop();
        timer.time = 0;
        timer.start();

        const order = Array.from({length:24}, (_,i)=>i);
        if (noun.vocative === false) {
            const first21 = order.slice(0,21);
            shuffle(first21);
            order.splice(0,24,...first21,21,22,23);
        } else {
            shuffle(order);
        }

        cards = [];
        order.forEach((answerIndex, slotIndex)=>{
            const r = Math.floor(answerIndex/3);
            const c = answerIndex%3;
            const text = noun.decl[r][c];
            const card = makeCard(text, answerIndex);
            card.slotIndex = slotIndex;
            card.answerIndex = answerIndex;
            card.locked = false;
            card.addTo(cardLayer).loc(slots[slotIndex].cx, slots[slotIndex].cy);
            cards.push(card);
        });

        cardLayer.top();

        if (noun.vocative === false) {
            checkMatrix(8, true);
        }

        S.update();
    }

    function makeCard(text, answerIndex) {
        const card = new Container(cardW, cardH).reg(CENTER);
        const back = new Rectangle(cardW, cardH, blue.darken(.45), white, 2, 10).centerReg(card);
        const label = new Label({
            text:text,
            size:text.length > 14 ? 16 : 18,
            color:white,
            bold:true,
            align:CENTER,
            valign:CENTER
        }).centerReg(card);
        card.back = back;
        card.label = label;
        card.cursor = "grab";
        card.mouseChildren = false;
        card.drag();
        card.on("mousedown", ()=>{ if (!card.locked && !gameOver) card.top(); });
        card.on("pressup", ()=>handleDrop(card));
        return card;
    }

    function handleDrop(card) {
        if (gameOver || card.locked) {
            moveCardToSlot(card, card.slotIndex);
            return;
        }
        const targetIndex = getSlotAt(card.x, card.y);
        if (targetIndex == null || slots[targetIndex].locked) {
            moveCardToSlot(card, card.slotIndex);
            return;
        }
        const other = cards.find(c => c.slotIndex === targetIndex);
        if (!other || other.locked) {
            moveCardToSlot(card, card.slotIndex);
            return;
        }
        const oldIndex = card.slotIndex;
        card.slotIndex = targetIndex;
        other.slotIndex = oldIndex;
        moveCardToSlot(card, targetIndex);
        moveCardToSlot(other, oldIndex);
    }

    function getSlotAt(x, y) {
        for (let i=0; i<slots.length; i++) {
            const slot = slots[i];
            if (Math.abs(x - slot.cx) <= colW[2]/2 && Math.abs(y - slot.cy) <= rowH/2) {
                return i;
            }
        }
        return null;
    }

    function moveCardToSlot(card, slotIndex) {
        const slot = slots[slotIndex];
        card.animate({props:{x:slot.cx, y:slot.cy}, time:.18, ease:"quadOut"});
    }

    function checkMatrix(checkCaseNo=0, silent=false) {
        if (!isPlaying || gameOver || !noun) return;
        let wrong = 0;
        const rowsToCheck = checkCaseNo === 0
            ? Array.from({length: requiredRows}, (x, i) => i)
            : [checkCaseNo-1];

        rowsToCheck.forEach(r=>{
            if (r >= requiredRows) return;

            for (let c=0; c<3; c++) {
                const slotIndex = r*3+c;
                const card = cards.find(item => item.slotIndex === slotIndex);

                const expected = String(noun.decl[r][c]).trim();
                const actual = card ? String(card.label.text).trim() : "";

                if (!card || expected !== actual) wrong++;
            }
        });

        if (wrong === 0) {
            rowsToCheck.forEach(r=>lockRow(r));
            if (!silent) {
                message.color = green;
                message.text = checkCaseNo === 0 ? "Excellent — all rows are correct!" : `Successfully solved ${CASES[checkCaseNo-1]}.`;
            }
            if (solvedCount >= requiredRows) finishGame();
        } else {
            wrongMoves++;
            status.text = `Wrong Checks: ${toDevanagari(wrongMoves)}`;
            if (!silent) {
                message.color = red;
                message.text = checkCaseNo === 0
                    ? `${toDevanagari(wrong)} words are in the wrong position. Try again.`
                    : `${CASES[checkCaseNo-1]}: ${toDevanagari(wrong)} words are in the wrong position.`;
            }
        }
        S.update();
    }

    function lockRow(r) {
        if (solvedRows[r]) return;
        solvedRows[r] = true;
        if (!(noun.vocative === false && r === 7)) solvedCount++;
        for (let c=0; c<3; c++) {
            const slotIndex = r*3+c;
            slots[slotIndex].locked = true;
            slots[slotIndex].back.color = green.lighten(.55);
            slots[slotIndex].back.borderColor = green;
            const card = cards.find(item => item.slotIndex === slotIndex);
            if (card) {
                card.locked = true;
                card.mouseEnabled = false;
                card.cursor = "default";
                card.back.color = blue.darken(.45);
                card.back.borderColor = white;
            }
        }
    }

    function getTodayDateString() {
        const today = new Date();
        return today.toISOString().split('T')[0]; // Format: YYYY-MM-DD
    }

    function calculateScore() {
        const baseScore = 10000;
        const timePenalty = Math.round(timer.time * 12);
        const mistakePenalty = wrongMoves * 150;
        const rowsBonus = requiredRows === 8 ? 0 : -400;

        const score = baseScore + rowsBonus - timePenalty - mistakePenalty;
        return Math.max(100, Math.min(10000, Math.round(score)));
    }

    async function uploadScore(finalScore) {
        if (scoreUploaded) return;

        const user = auth.currentUser;

        if (!user) {
            console.log("User is not logged in. Score was not saved.");
            return;
        }

        scoreUploaded = true;

        const gameId = "shabd";
        const gameName = "Shabd Puzzle";
        const today = getTodayDateString();
        const recordId = `${user.uid}_${gameId}_${today}`;
        const scoreRef = doc(db, "leaderboard-zatamgame", recordId);

        try {
            const existingSnapshot = await getDoc(scoreRef);

            if (!existingSnapshot.exists()) {
                await setDoc(scoreRef, {
                    userId: user.uid,
                    playerName: user.displayName || "Player",
                    email: user.email || "",
                    photoURL: user.photoURL || "",
                    gameId: gameId,
                    gameName: gameName,
                    score: finalScore,
                    scoreDate: today,
                    createdAt: serverTimestamp(),
                    updatedAt: serverTimestamp()
                });

                console.log("Daily Shabd score created:", finalScore);
                return;
            }

            const existingData = existingSnapshot.data();
            const oldScore = Number(existingData.score) || 0;

            if (finalScore > oldScore) {
                await updateDoc(scoreRef, {
                    playerName: user.displayName || "Player",
                    email: user.email || "",
                    photoURL: user.photoURL || "",
                    gameName: gameName,
                    score: finalScore,
                    updatedAt: serverTimestamp()
                });

                console.log(`Daily Shabd score improved: ${oldScore} → ${finalScore}`);
            } else {
                console.log(`Existing daily score kept: ${oldScore}. New score: ${finalScore}`);
            }
        } catch (error) {
            scoreUploaded = false;
            console.error("Shabd Puzzle score upload failed:", error);
            alert("Score upload failed. Please try again.");
        }
    }

    function finishGame() {
        if (gameOver) return;
        gameOver = true;
        isPlaying = false;
        timer.pause(true);

        const finalScore = calculateScore();

        if (!usedSolve) {
            uploadScore(finalScore);
        }

        message.color = green;
        message.text = usedSolve
            ? `शुभम्! Solved by helper — score not submitted.`
            : `शुभम्! Complete — Score: ${toDevanagari(finalScore)}`;

        const pane = new Pane({
            width:620,
            height:330,
            color:black,
            backgroundColor:yellow.lighten(.35),
            close:true
        });

        new Label({
            text:`शुभम्! You solved the Shabd Puzzle!

Time: ${timer.text}
Wrong Checks: ${toDevanagari(wrongMoves)}
Rows Solved: ${toDevanagari(solvedCount)} / ${toDevanagari(requiredRows)}
Score: ${toDevanagari(finalScore)}${usedSolve ? "\nScore not submitted because SOLVE was used." : ""}`,
            size:24,
            color:black,
            align:CENTER,
            valign:CENTER
        })
        .center(pane)
        .mov(0,-35);

        new Button({
            label:new Label({text:"PLAY AGAIN", size:18}),
            width:150,
            height:40,
            backgroundColor:green,
            color:white
        })
        .pos(0,35,CENTER,BOT,pane)
        .tap(() => {
            pane.hide();
            startGame();
        });

        pane.show();
    }

    function solveBoard() {
        if (!noun) return;
        usedSolve = true;
        cards.forEach(card=>{
            card.slotIndex = card.answerIndex;
            moveCardToSlot(card, card.answerIndex);
        });
        timeout(.25, ()=>checkMatrix(0));
    }
}
</script>

<body>
    <div class="auth-bar">
        <button id="shabdLoginBtn">↪ Login</button>

        <div id="shabdUserProfile">
            <img id="shabdUserAvatar" src="" alt="User Avatar">
            <span id="shabdUserName"></span>
            <button id="shabdLogoutBtn">Logout</button>
        </div>
    </div>
</body>
