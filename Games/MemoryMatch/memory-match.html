<html lang="en">
<head>
  <meta charset="utf-8"/>

  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{width:100%;height:100%;background:#fffdf5;overflow:hidden}
    canvas{display:block}

    #lb-overlay{
      display:none;position:fixed;inset:0;background:rgba(9,38,74,.88);

    #lb-overlay.show{display:flex;}

    }
    #lb-close:hover{background:#f4a300;color:#09264a;}
    #lb-tabs{display:flex;padding:12px 24px 0;gap:8px;background:#fffdf5;}
    .lb-tab{

    #name-form{

    }
    #name-form.show{display:flex;}

<script>
// currentUser is kept in sync by the inline Firebase module at the bottom of
// this file (self-contained, same pattern as Numerale — no external file).
let currentUser = null;
window._onAuthChange = function(user){ currentUser = user; };

const PLAYER_KEY = 'zatam_playerName';
function getPlayerName(){ return localStorage.getItem(PLAYER_KEY) || ''; }
function setPlayerName(n){ localStorage.setItem(PLAYER_KEY, n.trim()); }

async function submitScore({ playerName, moves, timeSecs, stars }){
  const finalScore = moves * 100 + timeSecs;
  if(typeof uploadScore === 'function'){
    // Signed-in players are tracked by their real Firebase uid so their
    // daily best follows their account across the whole site's leaderboard.
    // Not signed in still works — falls back to the typed name / a
    // per-browser anonymous id, same as guest play.
    return await uploadScore({ playerName, score:finalScore, lowerIsBetter:true, stars });
  }
}

let currentLbDiff = 'easy';
async function fetchLeaderboard(diff){
  const body = document.getElementById('lb-body');
  body.innerHTML = '<div id="lb-loading">Loading…</div>';
  if(typeof fetchGameLeaderboard !== 'function'){ body.innerHTML = '<div id="lb-empty">Leaderboard not available</div>'; return; }
  try{
    const snap = await fetchGameLeaderboard('score','asc',10);
    if(snap.empty){ body.innerHTML = '<div id="lb-empty">No scores yet – be the first! 🎯</div>'; return; }
    const medals = ['🥇','🥈','🥉'];
    let html = '<table><thead><tr><th>#</th><th>Player</th><th>Score</th><th>⭐</th></tr></thead><tbody>';
    snap.forEach((d,i)=>{
      const data=d.data(), m=medals[i]?`<span class="lb-medal">${medals[i]}</span>`:'';
      html += `<tr><td>${m}${i+1}</td><td>${escHtml(data.playerName||'Anonymous')}</td><td>${data.score}</td><td>${'⭐'.repeat(data.stars||1)}</td></tr>`;
    });
    html += '</tbody></table>';
    body.innerHTML = html;
  } catch(e){ console.error('Leaderboard error:',e); body.innerHTML = '<div id="lb-empty">Error loading scores.</div>'; }
}
function escHtml(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtTime(s){ const m=Math.floor(s/60),sec=s%60; return m>0?m+'m '+String(sec).padStart(2,'0')+'s':sec+'s'; }

function openLeaderboard(diff){
  currentLbDiff = diff||'easy';
  document.querySelectorAll('.lb-tab').forEach(t=>t.classList.toggle('active',t.dataset.diff===currentLbDiff));
  document.getElementById('lb-overlay').classList.add('show');
  fetchLeaderboard(currentLbDiff);
}
document.getElementById('lb-close').onclick = ()=>document.getElementById('lb-overlay').classList.remove('show');
document.querySelectorAll('.lb-tab').forEach(t=>{
  t.onclick = ()=>{ currentLbDiff=t.dataset.diff; document.querySelectorAll('.lb-tab').forEach(x=>x.classList.remove('active')); t.classList.add('active'); fetchLeaderboard(currentLbDiff); };
});

let _nameResolve = null;
function askPlayerName(){
  return new Promise(resolve=>{
    _nameResolve = resolve;
    document.getElementById('name-form').classList.add('show');
    document.getElementById('name-input').value = getPlayerName();
    document.getElementById('name-input').focus();
  });
}
document.getElementById('name-submit').onclick = ()=>{
  const v = document.getElementById('name-input').value.trim();
  if(v) setPlayerName(v);
  document.getElementById('name-form').classList.remove('show');
  if(_nameResolve){ _nameResolve(v||'Anonymous'); _nameResolve=null; }
};
document.getElementById('name-skip').onclick = ()=>{
  document.getElementById('name-form').classList.remove('show');
  if(_nameResolve){ _nameResolve(getPlayerName()||'Anonymous'); _nameResolve=null; }
};
document.getElementById('name-input').onkeydown = e=>{ if(e.key==='Enter') document.getElementById('name-submit').click(); };

// ════════════════════════════════════════════════════════
//  GAME — zat.am warm theme
// ════════════════════════════════════════════════════════

const C = {
  bg:"#fffdf5",
  panel:"#09264a",
  card:"#f5ede0",
  border:"#d4b896",
  back:"#dde8f5",      // card back: light blue
  backBorder:"#09264a",
  green:"#3d9970",
  yellow:"#f4a300",
  blue:"#09264a",
  red:"#e05a2b",
  muted:"#6b7f96",
  light:"#fffdf5",
  dark:"#09264a",
};

// Sanskrit words paired to each picture emoji
// Format: { id, emoji, word (Sanskrit Devanagari), transliteration, color }
const ALL_PAIRS = [
  {id:1,  emoji:"🐶", word:"श्वान",   color:"#e07b39"},  // shvāna = dog
  {id:2,  emoji:"🐱", word:"मार्जार",  color:"#e05a2b"},  // mārjāra = cat
  {id:3,  emoji:"🌸", word:"पुष्प",    color:"#c45a9e"},  // puṣpa = flower
  {id:4,  emoji:"🌙", word:"चन्द्र",   color:"#7a6bcc"},  // candra = moon
  {id:5,  emoji:"🔥", word:"अग्नि",    color:"#e03d2b"},  // agni = fire
  {id:6,  emoji:"🌊", word:"तरङ्ग",   color:"#2b6cb0"},  // taraṅga = wave
  {id:7,  emoji:"⚡", word:"विद्युत्",  color:"#c49a00"},  // vidyut = lightning
  {id:8,  emoji:"🍀", word:"दल",       color:"#2d7a4a"},  // dala = leaf/petal
  {id:9,  emoji:"🎵", word:"संगीत",    color:"#b0468a"},  // saṃgīta = music
  {id:10, emoji:"🌈", word:"इन्द्रधनु", color:"#7a6bcc"}, // indradhanū = rainbow
  {id:11, emoji:"🦋", word:"पतङ्ग",    color:"#3d9970"},  // pataṅga = butterfly
  {id:12, emoji:"🍕", word:"भोजन",    color:"#e07b39"},  // bhojana = food
];

const DIFF = {
  easy:  {cols:4,rows:4,pairs:8, cw:140,ch:110,gap:18,label:"Easy",  color:C.green, thresh:[10,16]},
  medium:{cols:5,rows:4,pairs:10,cw:114,ch:100,gap:14,label:"Medium",color:C.yellow,thresh:[14,22]},
  hard:  {cols:6,rows:4,pairs:12,cw:100,ch:90, gap:10,label:"Hard",  color:C.red,   thresh:[18,28]},
};

function shuffle(arr){
  for(let i=arr.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]]=[arr[j],arr[i]];
  }
  return arr;
}
function buildDeck(n){
  const deck=[];
  ALL_PAIRS.slice(0,n).forEach(p=>{
    deck.push({id:p.id,type:"picture",emoji:p.emoji,word:p.word,color:p.color});
    deck.push({id:p.id,type:"word",   emoji:p.emoji,word:p.word,color:p.color});
  });
  return shuffle(deck);
}
function getRating(m,t){return m<=t[0]?3:m<=t[1]?2:1;}

let _ac;
function tone(f,t,d,v,dl=0){
  try{
    _ac=_ac||new(window.AudioContext||window.webkitAudioContext)();
    const o=_ac.createOscillator(),g=_ac.createGain();
    o.connect(g);g.connect(_ac.destination);o.type=t;
    o.frequency.setValueAtTime(f,_ac.currentTime+dl);
    g.gain.setValueAtTime(v,_ac.currentTime+dl);
    g.gain.exponentialRampToValueAtTime(0.001,_ac.currentTime+dl+d);
    o.start(_ac.currentTime+dl);o.stop(_ac.currentTime+dl+d);
  }catch(e){}
}
const SFX={
  flip :()=>tone(520,"sine",.1,.15),
  match:()=>{tone(520,"sine",.12,.18);tone(780,"sine",.15,.2,.12);},
  miss :()=>tone(200,"sawtooth",.1,.1),
  win  :()=>[523,659,784,1047].forEach((f,i)=>tone(f,"sine",.2,.18,i*.1)),
};

const GW=1024, GH=768, HEADER=90, FOOTER=60;
const frame = new Frame(FIT, GW, GH, C.bg, C.bg);

frame.on("ready", ()=>{
  const stage = frame.stage;
  const W = frame.width, H = frame.height;

  createjs.Ticker.timingMode = createjs.Ticker.RAF;
  createjs.Ticker.on("tick", stage);

  // Warm dot background
  const bgS = new Shape(W,H);
  for(let x=0;x<W;x+=40) for(let y=0;y<H;y+=40)
    bgS.graphics.beginFill("rgba(9,38,74,.05)").drawCircle(x,y,1.5).endFill();
  bgS.addTo(stage);
  // Saffron glow
  const glS = new Shape(W,H);
  glS.graphics.beginRadialGradientFill(
    ["rgba(244,163,0,.1)","rgba(255,253,245,0)"],[0,1],
    W/2,H/2,0, W/2,H/2,W*.55
  ).drawRect(0,0,W,H).endFill();
  glS.addTo(stage);

  // ── Header ────────────────────────────────────────────
  const hdr = new Container(W, HEADER).addTo(stage);
  new Rectangle(W, HEADER, C.panel).addTo(hdr);
  new Rectangle(W, 3, C.yellow).pos(0,HEADER-3,LEFT,TOP,hdr);
  new Label({text:"Memory Match",size:34,font:"Fredoka One",color:C.light}).pos(32,-6,LEFT,CENTER,hdr);
  new Label({text:"Pictures to Sanskrit Words",size:13,font:"Nunito",color:"#a8c4e0"}).pos(36,14,LEFT,CENTER,hdr);

  function scoreBlock(lbl,val,color,x){
    const b=new Container(100,56).addTo(hdr); b.x=x; b.y=(HEADER-56)/2;
    new Rectangle(100,56,C.card,color,2,10).addTo(b);
    new Label({text:lbl,size:10,font:"Nunito",color:C.muted,bold:true}).pos(0,7,CENTER,TOP,b);
    const v=new Label({text:String(val),size:24,font:"Fredoka One",color}).pos(0,0,CENTER,CENTER,b);
    return v;
  }
  const movLbl = scoreBlock("MOVES","0",C.blue,  W-360);
  const parLbl = scoreBlock("PAIRS","0",C.green, W-245);
  const timLbl = scoreBlock("TIME", "0s",C.yellow,W-130);

  const lbBtn = new Container(152,40).addTo(hdr);
  lbBtn.x = Math.round(W/2 - 76);
  lbBtn.y = Math.round((HEADER-40)/2);
  new Rectangle(152,40,"transparent",C.yellow,1.5,20).addTo(lbBtn);
  new Label({text:"🏅 Leaderboard",size:12,font:"Nunito",color:C.yellow,bold:true}).pos(0,0,CENTER,CENTER,lbBtn);
  lbBtn.cursor="pointer";
  lbBtn.on("click",()=>openLeaderboard(activeDiff));

  // ── Footer ────────────────────────────────────────────
  const ftr = new Container(W, FOOTER).addTo(stage);
  ftr.y = H-FOOTER;
  new Rectangle(W, FOOTER, C.panel).addTo(ftr);
  new Rectangle(W, 3, C.yellow).pos(0,0,LEFT,TOP,ftr);
  new Label({text:"DIFFICULTY",size:11,font:"Nunito",color:"#a8c4e0",bold:true}).pos(24,0,LEFT,CENTER,ftr);

  let activeDiff = "easy";
  const chipObjs = {};
  function makeChip(key,x){
    const d=DIFF[key];
    const chip=new Container(88,32).addTo(ftr); chip.x=x; chip.y=(FOOTER-32)/2;
    const bg=new Rectangle(88,32,key===activeDiff?d.color:"transparent",d.color,2,16).addTo(chip);
    const lbl=new Label({text:d.label,size:12,font:"Nunito",color:key===activeDiff?"#fff":d.color,bold:true})
      .pos(0,0,CENTER,CENTER,chip);
    chip.cursor="pointer"; chip.bg=bg; chip.lbl=lbl; chip.color=d.color; chip.key=key;
    chip.on("click",()=>{
      if(chip.key===activeDiff) return;
      Object.values(chipObjs).forEach(c=>{c.bg.color="transparent";c.lbl.color=c.color;});
      bg.color=d.color; lbl.color="#fff";
      activeDiff=key;
      startGame(key);
    });
    chipObjs[key]=chip;
  }
  makeChip("easy",140); makeChip("medium",238); makeChip("hard",336);

  const rstBtn=new Container(110,32).addTo(ftr);
  rstBtn.x=W-128; rstBtn.y=(FOOTER-32)/2;
  new Rectangle(110,32,"transparent","rgba(255,255,255,.3)",1,16).addTo(rstBtn);
  new Label({text:"↺  Restart",size:12,font:"Nunito",color:"rgba(255,255,255,.8)",bold:true}).pos(0,0,CENTER,CENTER,rstBtn);
  rstBtn.cursor="pointer";
  rstBtn.on("click",()=>startGame(activeDiff));

  let gameLayer = null;
  let moves=0, pairs=0, secs=0, started=false;
  let timerID=null, locked=false, first=null;

  function startTimer(){ if(started) return; started=true; timerID=setInterval(()=>{secs++;timLbl.text=fmtTime(secs);},1000); }
  function stopTimer(){clearInterval(timerID); timerID=null;}
  function resetState(){
    stopTimer();
    moves=0; pairs=0; secs=0; started=false; locked=false; first=null;
    movLbl.text="0"; parLbl.text="0"; timLbl.text="0s";
  }

  function revealCard(card){
    card.flipped=true; card.bk.visible=false; card.ft.visible=true; SFX.flip();
    card.scaleX=0.85; card.scaleY=0.85;
    animate({target:card,props:{scaleX:1,scaleY:1},time:160,ease:"backOut"});
  }
  function hideCard(card){
    card.flipped=false; card.ft.visible=false; card.bk.visible=true;
    card.scaleX=0.85; card.scaleY=0.85;
    animate({target:card,props:{scaleX:1,scaleY:1},time:160,ease:"backOut"});
  }
  function lockMatch(a,b){
    SFX.match(); a.matched=true; b.matched=true;
    a.cursor="default"; b.cursor="default";
    [a,b].forEach(c=>{
      new Rectangle(c.cw,c.ch,"rgba(61,153,112,.15)","#3d9970",2,12).addTo(c);
      const badge=new Container(26,26).addTo(c); badge.x=c.cw-32; badge.y=6;
      new Circle(13,"#3d9970").pos(0,0,LEFT,TOP,badge);
      new Label({text:"✓",size:13,font:"Nunito",color:"#fff",bold:true}).pos(0,-1,CENTER,CENTER,badge);
      animate({target:c,props:{scaleX:1.1,scaleY:1.1},time:90,ease:"quadOut",
        call:()=>animate({target:c,props:{scaleX:1,scaleY:1},time:200,ease:"elasticOut"})});
    });
    pairs++; parLbl.text=String(pairs);
    if(pairs===DIFF[activeDiff].pairs){stopTimer(); setTimeout(()=>showWin(activeDiff),600);}
  }

  function onCardClick(card){
    if(card.flipped||card.matched||locked) return;
    if(!first){
      startTimer(); first=card; revealCard(card);
    } else {
      locked=true; const a=first; first=null;
      revealCard(card); moves++; movLbl.text=String(moves);
      setTimeout(()=>{
        if(a.data.id===card.data.id && a.data.type!==card.data.type){
          lockMatch(a,card); locked=false;
        } else {
          SFX.miss();
          [a,card].forEach(c=>{
            animate({target:c,props:{x:c.x-6},time:50,ease:"quadOut",call:()=>
              animate({target:c,props:{x:c.x+12},time:70,ease:"quadInOut",call:()=>
                animate({target:c,props:{x:c.x-6},time:50,ease:"quadOut"})})});
          });
          setTimeout(()=>{hideCard(a); hideCard(card); locked=false;},650);
        }
      },800);
    }
  }

  function showWin(diffKey){
    SFX.win();
    const finalMoves=moves, finalPairs=pairs, finalSecs=secs;
    const stars = finalMoves < 20 ? 3 : finalMoves < 30 ? 2 : 1;
    const starStr = "⭐".repeat(stars) + "✩".repeat(3-stars);

    // Populate and show the HTML win overlay — guaranteed to appear on top
    document.getElementById('win-stars').textContent = starStr;
    document.getElementById('win-moves').textContent = finalMoves;
    document.getElementById('win-pairs').textContent = finalPairs;
    document.getElementById('win-time').textContent = fmtTime(finalSecs);
    const savedName = getPlayerName();
    const nameRow = document.getElementById('win-name-row');
    const nameInput = document.getElementById('win-name-input');
    if(currentUser){
      nameInput.value = currentUser.displayName || savedName || '';
      nameRow.querySelector('label').textContent = 'Playing as (signed in)';
    } else {
      nameInput.value = savedName || '';
      nameRow.querySelector('label').textContent = 'YOUR NAME (for the leaderboard)';
    }
    document.getElementById('win-overlay').classList.add('show');
    setTimeout(()=>document.getElementById('win-name-input').focus(), 100);

    document.getElementById('win-save').onclick = async ()=>{
      const btn = document.getElementById('win-save');
      const name = document.getElementById('win-name-input').value.trim() || 'Anonymous';
      setPlayerName(name);
      btn.disabled = true; btn.textContent = 'Saving…';
      const res = await submitScore({playerName:name, moves:finalMoves, timeSecs:finalSecs, stars});
      btn.disabled = false; btn.textContent = '💾 Save Score';
      if(res && res.ok === false){ alert('Could not save score — check your connection and try again.'); return; }
      document.getElementById('win-overlay').classList.remove('show');
      startGame(activeDiff);
    };
    document.getElementById('win-play-again').onclick = ()=>{
      document.getElementById('win-overlay').classList.remove('show');
      startGame(activeDiff);
    };
    document.getElementById('win-name-input').onkeydown = e=>{
      if(e.key==='Enter') document.getElementById('win-save').click();
    };
  }

  function showStart(){
    const pn=new Container(440,240).addTo(stage); pn.center(stage);
    new Rectangle(440,240,"#fffdf5",C.yellow,2.5,22).addTo(pn);
    new Rectangle(440,14,C.yellow,null,0,14).pos(0,0,LEFT,TOP,pn);
    new Label({text:"🃏",size:46}).pos(0,18,CENTER,TOP,pn);
    new Label({text:"Ready to Play?",size:28,font:"Fredoka One",color:C.dark}).pos(0,78,CENTER,TOP,pn);
    new Label({text:"Match each picture to its Sanskrit word",size:13,font:"Nunito",color:C.muted}).pos(0,118,CENTER,TOP,pn);
    const btn=new Container(200,44).addTo(pn); btn.x=120; btn.y=165;
    new Rectangle(200,44,C.yellow,null,0,22).addTo(btn);
    new Label({text:"Start Game",size:18,font:"Fredoka One",color:"#fff"}).pos(0,0,CENTER,CENTER,btn);
    btn.cursor="pointer";
    btn.on("click",()=>{ pn.removeFrom(stage); stage.update(); startTimer(); });
    pn.addTo(stage);
    hdr.addTo(stage); ftr.addTo(stage);
  }

  function startGame(diffKey){
    resetState();
    if(gameLayer){gameLayer.removeAllChildren(); gameLayer.removeFrom(stage);}
    gameLayer=new Container().addTo(stage);

    const d=DIFF[diffKey];
    const gridW=d.cols*d.cw+(d.cols-1)*d.gap;
    const gridH=d.rows*d.ch+(d.rows-1)*d.gap;
    const gx=Math.round((W-gridW)/2);
    const gy=HEADER+Math.round((H-HEADER-FOOTER-gridH)/2);

    new Rectangle(gridW+48,gridH+48,"#ffffff",C.border,1.5,16)
      .pos(gx-24,gy-24,LEFT,TOP,gameLayer);

    buildDeck(d.pairs).forEach((data,i)=>{
      const col=i%d.cols, row=Math.floor(i/d.cols);
      const cx=gx+col*(d.cw+d.gap), cy=gy+row*(d.ch+d.gap);
      const card=new Container(d.cw,d.ch);
      card.x=cx; card.y=cy;
      card.data=data; card.flipped=false; card.matched=false;
      card.cw=d.cw; card.ch=d.ch;

      // Card back — navy with Devanagari "Z" watermark
      const bk=new Container(d.cw,d.ch);
      new Rectangle(d.cw,d.ch,C.panel,C.border,1.5,12).addTo(bk);
      new Rectangle(d.cw-14,d.ch-14,"transparent","rgba(255,255,255,.08)",1,8).pos(7,7,LEFT,TOP,bk);
      new Label({text:"ज",size:Math.round(d.cw*.22),font:"Fredoka One",color:"rgba(255,255,255,.12)"})
        .pos(0,0,CENTER,CENTER,bk);
      bk.addTo(card);

      // Card front
      const ft=new Container(d.cw,d.ch); ft.visible=false;
      new Rectangle(d.cw,d.ch,"#ffffff",data.color,2,12).addTo(ft);
      new Rectangle(d.cw,10,data.color,null,0,12).pos(0,0,LEFT,TOP,ft);

      if(data.type==="picture"){
        // Show emoji (picture stays — no change needed)
        new Label({text:data.emoji,size:Math.round(d.cw*.32)}).pos(0,4,CENTER,CENTER,ft);
        new Label({text:"PICTURE",size:9,font:"Nunito",color:data.color,bold:true}).pos(0,7,CENTER,BOTTOM,ft);
      } else {
        // Show Sanskrit Devanagari word instead of English
        const fontSize = d.cw >= 140 ? 22 : d.cw >= 114 ? 18 : 15;
        new Label({text:data.word,size:fontSize,font:"Nunito",color:data.color,bold:true}).pos(0,4,CENTER,CENTER,ft);
        new Label({text:"SANSKRIT",size:9,font:"Nunito",color:data.color,bold:true}).pos(0,7,CENTER,BOTTOM,ft);
      }
      ft.addTo(card);
      card.bk=bk; card.ft=ft;

      card.on("mouseover",()=>{
        if(!card.flipped&&!card.matched)
          animate({target:card,props:{scaleX:1.06,scaleY:1.06},time:80,ease:"quadOut"});
      });
      card.on("mouseout",()=>{
        if(!card.flipped&&!card.matched)
          animate({target:card,props:{scaleX:1,scaleY:1},time:80,ease:"quadOut"});
      });
      card.cursor="pointer";
      card.on("click",()=>onCardClick(card));
      card.addTo(gameLayer);
    });

    hdr.addTo(stage); ftr.addTo(stage);
    showStart();
  }

  startGame("easy");
});
</script>

<script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js';
import{getAuth,GoogleAuthProvider,signInWithPopup,signOut,onAuthStateChanged}from'https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js';
import{getFirestore,collection,doc,getDoc,setDoc,updateDoc,serverTimestamp,getDocs,query,where,orderBy,limit}from'https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js';

// Same project as the rest of the site (main site, Tic Tac Toe) so a
// signed-in session carries over between games.
const app=initializeApp({
  apiKey:'AIzaSyC8nm8zQR6fiC_3mTQ3hURXNJPR6faKYOU',
  authDomain:'zat-am-main.firebaseapp.com',
  projectId:'zat-am-main',
  storageBucket:'zat-am-main.appspot.com',
  messagingSenderId:'1071341524876',
  appId:'1:1071341524876:web:1908319951cd8f50b2e8a9'
});
const auth=getAuth(app),db=getFirestore(app),provider=new GoogleAuthProvider();
const LEADERBOARD_COLLECTION='leaderboard-zatamgame',GAME_ID='memory',GAME_NAME='Memory Match';

function today(){return new Date().toISOString().split('T')[0];}
function getAnonId(){
  let id=localStorage.getItem('zatam_anon_id');
  if(!id){id='anon_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2);localStorage.setItem('zatam_anon_id',id);}
  return id;
}
function avatarFallback(n){return'https://ui-avatars.com/api/?name='+encodeURIComponent(n||'P')+'&background=ffe1a5&color=09264a';}

let currentUser=null;

function updateAuthUI(user){
  const signinBtn=document.getElementById('auth-signin-btn');
  const chip=document.getElementById('auth-user-chip');
  if(!signinBtn||!chip)return;
  if(user){
    signinBtn.style.display='none';chip.style.display='flex';
    const img=document.getElementById('auth-avatar-img');
    img.src=user.photoURL||avatarFallback(user.displayName);
    img.onerror=()=>{img.onerror=null;img.src=avatarFallback(user.displayName);};
    document.getElementById('auth-name-span').textContent=user.displayName||user.email||'Player';
  } else {
    signinBtn.style.display='flex';chip.style.display='none';
  }
}

async function doAuthSignIn(){
  const btn=document.getElementById('auth-signin-btn');
  btn.disabled=true;btn.textContent='Signing in…';
  try{ await signInWithPopup(auth,provider); }
  catch(e){ console.error('Sign-in error:',e.code,e.message); alert('Sign-in failed: '+(e.code||e.message)); }
  finally{
    btn.disabled=false;
    btn.innerHTML='<svg width="14" height="14" viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg> Sign in';
  }
}
async function doAuthSignOut(){
  try{ await signOut(auth); }catch(e){ console.error('Sign-out error:',e); }
}

document.getElementById('auth-signin-btn').addEventListener('click',doAuthSignIn);
document.getElementById('auth-signout-btn').addEventListener('click',doAuthSignOut);
onAuthStateChanged(auth, user=>{
  currentUser=user;
  updateAuthUI(user);
  if(typeof window._onAuthChange==='function') window._onAuthChange(user);
});

// Daily-best-per-player upload, per the Daily Best Score Implementation
// Guide: one document per player per game per day, keyed by
// `${userId}_${gameId}_${date}`. lowerIsBetter:true means a smaller score
// (fewer moves + less time) is the better one, which is how this game scores.
async function uploadScore({ playerName, score, scoreDate, lowerIsBetter=false, ...extra }){
  try{
    const uid = currentUser ? currentUser.uid : getAnonId();
    const date = scoreDate ? String(scoreDate).split('T')[0] : today();
    const recordId = `${uid}_${GAME_ID}_${date}`;
    const scoreRef = doc(db, LEADERBOARD_COLLECTION, recordId);
    const existing = await getDoc(scoreRef);

    const base = {
      userId: uid,
      playerName: currentUser ? (currentUser.displayName||playerName||'Player') : (playerName||'Anonymous'),
      email: currentUser ? (currentUser.email||'') : '',
      photoURL: currentUser ? (currentUser.photoURL||'') : '',
      gameId:GAME_ID, gameName:GAME_NAME, scoreDate:date,
      ...extra
    };

    if(!existing.exists()){
      await setDoc(scoreRef, { ...base, score, createdAt:serverTimestamp(), updatedAt:serverTimestamp() });
      return { ok:true, isNewBest:true };
    }
    const oldScore = Number(existing.data().score||0);
    const isBetter = lowerIsBetter ? score<oldScore : score>oldScore;
    if(isBetter){
      await updateDoc(scoreRef, { ...base, score, updatedAt:serverTimestamp() });
      return { ok:true, isNewBest:true };
    }
    return { ok:true, isNewBest:false };
  }catch(e){ console.error('Post score error:',e); return { ok:false }; }
}
window.uploadScore = uploadScore;

window.fetchGameLeaderboard = async function(orderField, direction, limitN){
  const q = query(collection(db, LEADERBOARD_COLLECTION), where('gameId','==',GAME_ID), orderBy(orderField, direction), limit(limitN));
  return await getDocs(q);
};
</script>
