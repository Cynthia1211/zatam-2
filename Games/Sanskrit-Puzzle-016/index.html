const SOLVED = [1,2,3,4,5,6,7,8,0];

const nb = i => {
  const r=Math.floor(i/3), c=i%3, a=[];
  if(r>0)a.push(i-3); if(r<2)a.push(i+3);
  if(c>0)a.push(i-1); if(c<2)a.push(i+1);
  return a;
};
const isSolved = () => brd.every((v,i) => v===SOLVED[i]);

function doShuffle(){
  brd=SOLVED.slice(); blank=8; let last=-1;
  for(let k=0;k<220;k++){
    let n=nb(blank).filter(x=>x!==last);
    if(!n.length) n=nb(blank);
    const nx=n[Math.floor(Math.random()*n.length)];
    [brd[blank],brd[nx]]=[brd[nx],brd[blank]];
    last=blank; blank=nx;
  }
  if(isSolved()) doShuffle();
}

    c.addChild(bfix);

const txt = new createjs.Text(

      });

      });
    })(c);

function doMove(clickedIdx){
  if(brd[clickedIdx]===0) return;
  if(nb(blank).indexOf(clickedIdx)===-1) return;

  let tc = null;
  for(let k=0;k<tileCons.length;k++){
    if(tileCons[k]._idx===clickedIdx){ tc=tileCons[k]; break; }
  }
  if(!tc) return;

  const dest = gxy(blank);

  brd[blank] = brd[clickedIdx];
  brd[clickedIdx] = 0;
  blank = clickedIdx;

  moves++;
  movesLbl.text = td(moves);
  startTimer();
  playClick();

  tc._idx = -1;

  
  createjs.Tween.get(tc)
    .to({scaleX:0.92, scaleY:0.92}, 50, createjs.Ease.quadOut)
    .to({x:dest.x, y:dest.y, scaleX:1, scaleY:1}, 130, createjs.Ease.quadOut)
    .call(function(){
      drawBoard();              
      if(isSolved()) onWin();
    });

  S.update();
}

/* ── TIMER ── */
function startTimer(){
  if(timerTick) return;
  const t0 = Date.now() - elapsed*1000;
  timerTick = Ticker.add(()=>{
    elapsed = Math.floor((Date.now()-t0)/1000);
    timeLbl.text = ft(elapsed);
    S.update();
  });
}
function stopTimer(){ if(timerTick){ Ticker.remove(timerTick); timerTick=null; } }
function resetTimer(){ stopTimer(); elapsed=0; timeLbl.text=ft(0); }

/* ── SOUND ── */
let actx=null;
function ea(){ if(!actx){ const A=window.AudioContext||window.webkitAudioContext; if(A) actx=new A(); } }
function tone(f,d,t='sine',v=0.12){
  if(muted) return; ea(); if(!actx) return;
  const n=actx.currentTime, o=actx.createOscillator(), g=actx.createGain();
  o.type=t; o.frequency.value=f;
  g.gain.setValueAtTime(v,n); g.gain.exponentialRampToValueAtTime(0.001,n+d);
  o.connect(g); g.connect(actx.destination); o.start(n); o.stop(n+d+0.02);
}

function confettiShower() {

    const colors = [
        "#D8A928",
        "#E89A5B",
        "#1B998B",
        "#57B894",
        "#E76F51",
        "#F4D35E"
    ];

    for (let i = 0; i < 120; i++) {

        const piece = new Circle(rand(4,8), colors[rand(colors.length)]);

        piece.loc(rand(0, FW), -20);

        S.addChild(piece);

        createjs.Tween.get(piece)
            .wait(rand(0,600))
            .to({
                x: piece.x + rand(-120,120),

async function uploadScore(score){

let user = auth.currentUser;

if(!user){
    alert("Please login first.");
    return;
}

if(scoreUploaded) return;
scoreUploaded = true;

    const scoreData = {

        userId: user.uid,
        playerName: user.displayName || "Player",
        email: user.email || "",
        photoURL: user.photoURL || "",

        gameId: "sanskritPuzzle",
        gameName: "Sanskrit Puzzle",

        score: score,

        createdAt: serverTimestamp(),
        scoreDate: new Date().toISOString().split("T")[0]

    };

    try{

        await addDoc(
            collection(db,"leaderboard"),
            scoreData
        );

        console.log("Score uploaded!", scoreData);

    }catch(error){
      scoreUploaded = false;

        console.error(error);

        alert("Score upload failed.");

    }

}

window.addEventListener('keydown', e=>{
  let t=null;
  if(e.key==='ArrowUp')    t=blank+3;
  else if(e.key==='ArrowDown')  t=blank-3;
  else if(e.key==='ArrowLeft')  t=blank+1;
  else if(e.key==='ArrowRight') t=blank-1;
  else return;
  if(t<0||t>8||nb(blank).indexOf(t)===-1) return;
  e.preventDefault(); doMove(t);
});
