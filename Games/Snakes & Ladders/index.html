<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Snakes and Ladders</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      import {
        auth,
        db,
        doc,
        getDoc,
        setDoc,
        updateDoc,
        serverTimestamp
      } from "../../firebase-config.js";

      window.ZATAM_FIREBASE_SCORE_UPLOAD = async (entry) => {
        const user = auth.currentUser;
        if (!user) return;

        const now = new Date();
        const today = entry.scoreDate || `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, "0")}-${String(now.getDate()).padStart(2, "0")}`;
        const gameId = entry.gameId || "laddersSnakes";
        const scoreId = `${user.uid}_${gameId}_${today}`;
        const scoreRef = doc(db, "leaderboard-zatamgame", scoreId);
        const scoreData = {
          userId: user.uid,
          playerName: user.displayName || entry.name || "Player",
          email: user.email || "",
          photoURL: user.photoURL || "",
          gameId,
          gameName: entry.gameName || "Ladders & Snakes",
          score: entry.score,
          scoreDate: today,
          updatedAt: serverTimestamp()
        };

        const existingScore = await getDoc(scoreRef);
        if (!existingScore.exists()) {
          await setDoc(scoreRef, {
            ...scoreData,
            createdAt: serverTimestamp()
          });
          return;
        }

        const oldScore = Number(existingScore.data()?.score || 0);
        if (entry.score > oldScore) {
          await updateDoc(scoreRef, scoreData);
        }
      };
    </script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://zimjs.org/cdn/016/zim.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
